spring:
  application:
    name: water-connect-system
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # TODO: Change to validate after liquibase implementation
    show-sql: false
    properties:
      hibernate:
        default_schema: water_connect
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    enabled: true
    default-schema: water_connect_liquibase
    show-summary: verbose
    show-summary-output: log

---
# ── DEV profile ──
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
      file: ./docker-compose.yml
      lifecycle-management: start-only  # start on boot, keep running between restarts
  datasource:
    url: jdbc:postgresql://localhost:5432/water-connect-system
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# ── PROD profile ──
spring:
  config:
    activate:
      on-profile: prod
  docker:
    compose:
      enabled: false  # DB is an external service in prod, not managed by Docker Compose
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
