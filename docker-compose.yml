services:
  db:
    image: postgres:16-alpine
    restart: always
    container_name: water_connect_system_postgres_db
    environment:
      POSTGRES_DB: water-connect-system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - water_connect_system_db:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d water-connect-system" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  water_connect_system_db:
    driver: local
