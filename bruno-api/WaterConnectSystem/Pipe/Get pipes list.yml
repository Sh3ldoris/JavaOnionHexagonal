info:
  name: Get pipes list
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/v1/pipes?material=COPPER&status=PLANNED
  params:
    - name: material
      value: COPPER
      type: query
    - name: status
      value: PLANNED
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
